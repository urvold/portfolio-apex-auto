name: Build and deploy APEX AUTO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out only this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install locked dependencies
        run: npm ci
      - name: Check repository inputs
        run: npm run check:secrets
      - name: Build all 11 static pages
        env:
          APEX_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          APEX_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - name: Verify Pages routes and resources
        env:
          APEX_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          APEX_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run check:pages
      - name: Upload static output only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish this repository's Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
